<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scroll-Driven Video</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    background: #0a0a0a;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  /* This tall section creates the scroll distance that drives the animation.
     Increase/decrease the height (e.g. 500vh) to make the scroll scrubbing
     slower/faster. */
  .scroll-container {
    position: relative;
    height: 500vh;
  }

  /* The canvas + its wrapper stay pinned to the viewport while the
     .scroll-container is scrolled through. */
  .sticky-stage {
    position: sticky;
    top: 0;
    height: 100vh;
    width: 100%;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0a0a0a;
  }

  canvas {
    max-width: 100%;
    max-height: 100%;
    display: block;
  }

  .progress-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    height: 4px;
    width: 0%;
    background: #ffffff;
    z-index: 20;
    transition: width 0.05s linear;
  }

  .loader {
    position: fixed;
    inset: 0;
    background: #0a0a0a;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    letter-spacing: 0.05em;
    z-index: 50;
    transition: opacity 0.4s ease;
  }
  .loader.hidden {
    opacity: 0;
    pointer-events: none;
  }

  .hint {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(255,255,255,0.6);
    font-size: 13px;
    letter-spacing: 0.04em;
    z-index: 20;
    pointer-events: none;
    transition: opacity 0.3s ease;
  }
</style>
</head>
<body>

  <div class="loader" id="loader">Loading frames… <span id="loadPct">0%</span></div>
  <div class="progress-bar" id="progressBar"></div>
  <div class="hint" id="hint">Scroll to play ↓</div>

  <div class="scroll-container">
    <div class="sticky-stage">
      <canvas id="frameCanvas"></canvas>
    </div>
  </div>

  <script>
    // ---- CONFIG ----
    const FRAME_COUNT = 150;                 // total number of frames
    const FRAME_PATH = (i) => `frames/frame_${String(i).padStart(4, '0')}.jpg`;
    // ----------------

    const canvas = document.getElementById('frameCanvas');
    const ctx = canvas.getContext('2d');
    const loader = document.getElementById('loader');
    const loadPct = document.getElementById('loadPct');
    const progressBar = document.getElementById('progressBar');
    const hint = document.getElementById('hint');
    const scrollContainer = document.querySelector('.scroll-container');

    const images = new Array(FRAME_COUNT);
    let loadedCount = 0;

    function preloadImages() {
      return new Promise((resolve) => {
        for (let i = 1; i <= FRAME_COUNT; i++) {
          const img = new Image();
          img.src = FRAME_PATH(i);
          img.onload = img.onerror = () => {
            loadedCount++;
            const pct = Math.round((loadedCount / FRAME_COUNT) * 100);
            loadPct.textContent = pct + '%';
            if (loadedCount === FRAME_COUNT) resolve();
          };
          images[i - 1] = img;
        }
      });
    }

    function resizeCanvas() {
      const first = images[0];
      if (!first || !first.naturalWidth) return;
      const aspect = first.naturalWidth / first.naturalHeight;
      let w = window.innerWidth;
      let h = window.innerHeight;
      if (w / h > aspect) {
        w = h * aspect;
      } else {
        h = w / aspect;
      }
      canvas.width = first.naturalWidth;
      canvas.height = first.naturalHeight;
      canvas.style.width = w + 'px';
      canvas.style.height = h + 'px';
    }

    function drawFrame(index) {
      const img = images[index];
      if (!img || !img.naturalWidth) return;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    }

    let currentFrame = -1;
    let ticking = false;

    function updateOnScroll() {
      const rect = scrollContainer.getBoundingClientRect();
      const scrollDistance = scrollContainer.offsetHeight - window.innerHeight;
      const scrolled = Math.min(Math.max(-rect.top, 0), scrollDistance);
      const progress = scrollDistance > 0 ? scrolled / scrollDistance : 0;

      progressBar.style.width = (progress * 100) + '%';

      if (progress > 0.01) hint.style.opacity = '0';
      else hint.style.opacity = '1';

      const frameIndex = Math.min(
        FRAME_COUNT - 1,
        Math.floor(progress * FRAME_COUNT)
      );

      if (frameIndex !== currentFrame) {
        currentFrame = frameIndex;
        drawFrame(currentFrame);
      }
      ticking = false;
    }

    function onScroll() {
      if (!ticking) {
        requestAnimationFrame(updateOnScroll);
        ticking = true;
      }
    }

    window.addEventListener('scroll', onScroll, { passive: true });
    window.addEventListener('resize', () => {
      resizeCanvas();
      drawFrame(currentFrame === -1 ? 0 : currentFrame);
    });

    preloadImages().then(() => {
      resizeCanvas();
      drawFrame(0);
      loader.classList.add('hidden');
      updateOnScroll();
    });
  </script>

</body>
</html>
