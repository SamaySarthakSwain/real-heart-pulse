<header>Ear to Heart: Continuous Auricular Physiological Telemetry</header>
<h1 id="clinical-rationale--the-surveillance-gap">Clinical Rationale &amp; The Surveillance Gap</h1>
<h3 id="overcoming-the-failure-of-episodic-and-thoracic-monitoring">Overcoming the Failure of Episodic and Thoracic Monitoring</h3>
<div class="grid-3">
<div class="card">
<h3 style="color: #ef4444; margin-top:0;">Global Burden</h3>
<ul>
<li><strong>17.9 Million Deaths:</strong> Cardiovascular disease is the leading cause of global mortality.</li>
<li><strong>Out-of-Hospital Events:</strong> 70%+ of sudden cardiac deaths occur during daily activities or sleep.</li>
<li><strong>Occult Paroxysms:</strong> Brief arrhythmias vanish before hospital arrival.</li>
</ul>
</div>
<div class="card">
<h3 style="color: #0f172a; margin-top:0;">Episodic 12-Lead</h3>
<ul>
<li><strong>10-Second Window:</strong> Standard clinic ECGs capture only a static snapshot.</li>
<li><strong>Stationary Requirement:</strong> Precordial suction leads require supine immobilization.</li>
<li><strong>False Security:</strong> Normal resting tracing offers zero guarantee against nocturnal ventricular ectopy.</li>
</ul>
</div>
<div class="card">
<h3 style="color: #f59e0b; margin-top:0;">Holter Barriers</h3>
<ul>
<li><strong>Contact Dermatitis:</strong> Wet hydrogel electrodes cause allergic skin irritation.</li>
<li><strong>Motion Artifacts:</strong> Torso flexure creates severe pectoral EMG noise.</li>
<li><strong>Non-Compliance:</strong> Heavy wiring leads to patient drop-out within 48 hours.</li>
</ul>
</div>
</div>

<header>Ear to Heart: Continuous Auricular Physiological Telemetry</header>
<h1 id="why-the-human-ear-anatomical-advantages">Why the Human Ear? Anatomical Advantages</h1>
<div class="grid-2">
<div>
<h3 id="biophysical-characteristics">Biophysical Characteristics</h3>
<ul>
<li data-marpit-fragment="1"><strong>Chondral Stability:</strong> The ear canal and concha are backed by elastic cartilage, isolating biopotentials from gross skeletal muscle tremors.</li>
<li data-marpit-fragment="2"><strong>Cephalic Perfusion:</strong> Proximity to descending branches of the superficial temporal and posterior auricular arteries.</li>

<header>Ear to Heart: Continuous Auricular Physiological Telemetry</header>
<h1 id="end-to-end-system-architecture">End-to-End System Architecture</h1>
<div class="grid-2">
<div>
<p><img src="../figures/exports/fig1_system_architecture.png" alt="" style="width:520px;" /></p>
</div>
<div>
<h3 id="5-stage-operational-pipeline">5-Stage Operational Pipeline</h3>
<ol>
<li><strong>Wearable Sensor Node:</strong> ESP32 MCU synchronously polling AD8232 ECG (500 Hz), MAX30102 PPG (100 Hz), BMI323 IMU (20 Hz), and LM35 Temp (4 Hz).</li>
<li><strong>Dual Telemetry Dispatch:</strong> Hardware UART + local WebSocket (Port 81) + BLE 5.0 notification frames.</li>
<li><strong>Biomedical SQI Engine:</strong> Zero-phase bandpass filtering, Pan-Tompkins QRS detection, and IMU motion gating.</li>
<li><strong>Deep Inference Core:</strong> Native single-lead SE-ResNet-BiGRU + Clinical Stacking Ensembles.</li>
<li><strong>Cross-Platform Delivery:</strong> React 19 web suite + Flutter Android mobile application.</li>
</ol>
</div>

<header>Ear to Heart: Continuous Auricular Physiological Telemetry</header>
<h1 id="deep-learning-resolving-the-12-lead-fallacy">Deep Learning: Resolving the 12-Lead Fallacy</h1>
<div class="grid-2">
<div class="card" style="border-top: 4px solid #ef4444;">
<h3 style="color: #ef4444; margin-top:0;">The Pseudo-12-Lead Flaw</h3>
<ul>
<li data-marpit-fragment="1"><strong>The Workaround:</strong> Naively cloning single-lead signals across 12 channels (<code>np.repeat(sig, 12)</code>).</li>
<li data-marpit-fragment="2"><strong>Physics Violation:</strong> Destroys natural precordial vector progression across V1–V6.</li>
<li data-marpit-fragment="3"><strong>Catastrophic Collapse:</strong> Ventricular Hypertrophy (HYP) sensitivity collapsed to <strong>46.0%</strong>.</li>
<li data-marpit-fragment="4"><strong>Clinical Hazard:</strong> Over 1 in 3 hypertrophy patients were falsely labeled normal.</li>
</ul>
</div>
<div class="card" style="border-top: 4px solid #10b981;">
